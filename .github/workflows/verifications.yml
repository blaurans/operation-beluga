name: Vérifications

# Le contenu des quêtes est du JavaScript : une faute de frappe dans un flag,
# un `order` dupliqué ou une explication trop courte empêche le serveur de
# démarrer. Sur une URL publique, ce serait découvert par un élève devant
# trente collègues — ou pire, par l'enseignant la veille d'un cours.
#
# C'est la raison d'être de ce fichier. La réécriture des quêtes a d'ailleurs
# montré que les tests unitaires ne suffisent pas : ils ne lancent pas Docker,
# et le seul contrôle qui exécute réellement chaque commande de récupération
# (`npm run check-fetchhints`) reste manuel.

on:
  push:
    branches: [main]
  pull_request:

# Le portail que la CI vérifie. En dur ici, et passé en argument aux deux
# scripts qui interrogent la production : `check-fetchhints.js` et
# `nettoie-verif.js` ont une URL par défaut, et se tromper de valeur fait
# valider le portail d'atelierdocker en croyant vérifier celui-ci — c'est-à-dire
# ne rien vérifier du tout. Le port de tests ci-dessous est sans rapport.
env:
  PORTAIL: https://operation-beluga.laurans.org

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Installer les dépendances
        run: npm ci

      - name: Suite de tests
        run: npm test

      - name: Valider le contenu des quêtes
        run: npm run check-content

      - name: Construire l'image
        run: docker build -t operation-beluga:ci .

      - name: Vérifier que l'image démarre et sert le programme
        run: |
          docker run -d --name test -p 127.0.0.1:8099:8000 \
            -e ADMIN_KEY=ci -e RATE_LIMIT=off \
            operation-beluga:ci
          # Le démarrage doit être immédiat : une erreur de contenu fait
          # boucler le conteneur, et c'est exactement ce qu'on veut voir ici.
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8099/healthz > /dev/null; then break; fi
            sleep 1
          done
          curl -sf http://127.0.0.1:8099/healthz
          curl -sf http://127.0.0.1:8099/api/quests | head -c 200
          echo
          docker logs test
          docker rm -f test

  # Le contrôle des commandes de récupération est le seul qui prouve que le jeu
  # marche sur une vraie machine. Il est ici plutôt que dans les tests
  # unitaires parce qu'il est lent — quelques minutes — et qu'il échoue si la
  # machine n'a pas de Docker utilisable.
  #
  # On le lance sur `main` uniquement, et en continu : il va chercher le
  # portail réel, et il inscrit un joueur. Une exécution par jour suffit à
  # attraper une régression ; à chaque commit, ce serait du bruit.
  commandes:
    needs: tests
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - run: npm ci

      - name: Rejouer les commandes de récupération de mot de passe
        run: npm run check-fetchhints -- "$PORTAIL"

      # `check-fetchhints` supprime son propre joueur, et il connaît enfin le nom
      # qu'il a tiré au sort. Ce filet rattrape ce qu'une exécution interrompue a
      # laissé : le menu « Suivi de la classe » de production ne doit jamais
      # afficher un joueur de vérification.
      #
      # Le secret `BELUGA_ADMIN_KEY` doit être configuré sur ce dépôt, sinon
      # `nettoie-verif` sort en 0 en disant qu'il n'y a rien à nettoyer et
      # chaque exécution laisse un joueur derrière elle.
      - name: Nettoyer les joueurs de vérification restants
        if: always()
        run: npm run nettoie-verif -- "$PORTAIL"
        env:
          BELUGA_ADMIN_KEY: ${{ secrets.BELUGA_ADMIN_KEY }}
        continue-on-error: true
